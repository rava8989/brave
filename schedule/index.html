<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Schedule">
  <meta name="description" content="Rotating shift schedule calendar with swap requests and supervisor approval.">
  <title>LGA Rotating Schedule</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232563eb'/%3E%3Ctext x='32' y='42' font-size='30' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css?v=20260910f">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" id="brand">LGA Rotating Schedule<small id="brandSub">Loading…</small></div>
      <div class="user-chip" id="userChip" hidden></div>
    </header>

    <main class="view" id="view" aria-live="polite"></main>

    <nav class="tabbar no-print" id="tabbar" hidden>
      <button type="button" data-tab="calendar" aria-label="Calendar"><span class="ico">📅</span><span>Calendar</span></button>
      <button type="button" data-tab="team" aria-label="Posted schedule"><span class="ico">📋</span><span>Schedule</span></button>
      <button type="button" data-tab="requests" aria-label="Swap requests"><span class="ico">🔁</span><span>Requests</span><span class="badge" id="reqBadge" hidden></span></button>
      <button type="button" data-tab="rotation" aria-label="Rotation"><span class="ico">🔄</span><span>Rotation</span></button>
      <button type="button" data-tab="info" aria-label="Info and settings"><span class="ico">ℹ️</span><span>Info</span></button>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <div id="toastRoot"></div>

  <noscript><p style="padding:20px">This schedule needs JavaScript turned on.</p></noscript>

  <!-- Data + logic (no build step; order matters) -->
  <script src="js/config.js?v=20260910f"></script>
  <script src="js/engine.js?v=20260910f"></script>
  <script src="js/store.js?v=20260910f"></script>
  <script src="js/swaps.js?v=20260910f"></script>
  <!-- UI -->
  <script src="js/ui-common.js?v=20260910f"></script>
  <script src="js/ui-forms.js?v=20260910f"></script>
  <script src="js/ui-calendar.js?v=20260910f"></script>
  <script src="js/ui-team.js?v=20260910f"></script>
  <script src="js/ui-requests.js?v=20260910f"></script>
  <script src="js/ui-rotation.js?v=20260910f"></script>
  <script src="js/ui-info.js?v=20260910f"></script>
  <script src="js/app.js?v=20260910f"></script>
</body>
</html>
